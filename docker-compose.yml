services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    environment:
      - PORT=4000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
